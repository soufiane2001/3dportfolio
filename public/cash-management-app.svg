<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0a00"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#ff6b00" flood-opacity="0.25"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="245" y="20" width="230" height="460" rx="36"/>
    </clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Glow blobs -->
  <circle cx="150" cy="250" r="160" fill="#ff6b00" opacity="0.05"/>
  <circle cx="650" cy="250" r="160" fill="#a855f7" opacity="0.05"/>

  <!-- Phone frame -->
  <rect x="243" y="18" width="234" height="464" rx="38" fill="#111" filter="url(#shadow)"/>
  <rect x="245" y="20" width="230" height="460" rx="36" fill="#1a1a1a"/>

  <!-- Notch -->
  <rect x="320" y="24" width="80" height="20" rx="10" fill="#0a0a0a"/>
  <circle cx="370" cy="34" r="5" fill="#222"/>

  <!-- Phone screen content (clipped) -->
  <g clip-path="url(#phoneClip)">
    <!-- Status bar -->
    <rect x="245" y="20" width="230" height="50" fill="url(#headerGrad)"/>
    <text x="265" y="52" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">9:41</text>
    <text x="450" y="52" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="end">●●● WiFi 🔋</text>

    <!-- Header bar -->
    <rect x="245" y="58" width="230" height="60" fill="url(#headerGrad)"/>
    <text x="360" y="82" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">My Wallet</text>
    <text x="360" y="106" font-family="Arial,sans-serif" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle">$12,840.50</text>

    <!-- White screen body -->
    <rect x="245" y="115" width="230" height="365" fill="#0f0f0f"/>

    <!-- Income / Expense pills -->
    <rect x="258" y="125" width="96" height="52" rx="12" fill="#1a2a1a"/>
    <text x="280" y="146" font-family="Arial,sans-serif" font-size="9" fill="#4ade80">↑ Income</text>
    <text x="280" y="165" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold">$5,240</text>

    <rect x="366" y="125" width="96" height="52" rx="12" fill="#2a1a1a"/>
    <text x="388" y="146" font-family="Arial,sans-serif" font-size="9" fill="#f87171">↓ Expense</text>
    <text x="388" y="165" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold">$2,180</text>

    <!-- Bar chart -->
    <text x="265" y="202" font-family="Arial,sans-serif" font-size="10" fill="#888">Monthly Spending</text>

    <!-- Bars -->
    <rect x="263" y="240" width="16" height="20" rx="3" fill="#ff6b00" opacity="0.4"/>
    <rect x="286" y="228" width="16" height="32" rx="3" fill="#ff6b00" opacity="0.5"/>
    <rect x="309" y="218" width="16" height="42" rx="3" fill="#ff6b00" opacity="0.7"/>
    <rect x="332" y="232" width="16" height="28" rx="3" fill="#ff6b00" opacity="0.5"/>
    <rect x="355" y="215" width="16" height="45" rx="3" fill="#ff6b00" opacity="0.8"/>
    <rect x="378" y="210" width="16" height="50" rx="3" fill="#ff6b00"/>
    <rect x="401" y="225" width="16" height="35" rx="3" fill="#ff6b00" opacity="0.6"/>

    <text x="263" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Jan</text>
    <text x="286" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Feb</text>
    <text x="309" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Mar</text>
    <text x="332" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Apr</text>
    <text x="355" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">May</text>
    <text x="378" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Jun</text>
    <text x="401" y="272" font-family="Arial,sans-serif" font-size="7" fill="#444">Jul</text>

    <!-- Transactions label -->
    <text x="265" y="292" font-family="Arial,sans-serif" font-size="10" fill="#888">Recent Transactions</text>

    <!-- Transaction rows -->
    <!-- 1 -->
    <circle cx="278" cy="315" r="14" fill="#ff6b00" opacity="0.15"/>
    <text x="278" y="319" font-family="Arial,sans-serif" font-size="11" fill="#ff6b00" text-anchor="middle">🍔</text>
    <text x="300" y="312" font-family="Arial,sans-serif" font-size="10" fill="#fff">Food</text>
    <text x="300" y="324" font-family="Arial,sans-serif" font-size="8" fill="#555">Today</text>
    <text x="455" y="316" font-family="Arial,sans-serif" font-size="11" fill="#f87171" text-anchor="end" font-weight="bold">-$24.50</text>
    <line x1="258" y1="332" x2="462" y2="332" stroke="#222" stroke-width="1"/>

    <!-- 2 -->
    <circle cx="278" cy="350" r="14" fill="#4ade80" opacity="0.15"/>
    <text x="278" y="354" font-family="Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">💰</text>
    <text x="300" y="347" font-family="Arial,sans-serif" font-size="10" fill="#fff">Salary</text>
    <text x="300" y="359" font-family="Arial,sans-serif" font-size="8" fill="#555">Yesterday</text>
    <text x="455" y="351" font-family="Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="end" font-weight="bold">+$3,200</text>
    <line x1="258" y1="367" x2="462" y2="367" stroke="#222" stroke-width="1"/>

    <!-- 3 -->
    <circle cx="278" cy="385" r="14" fill="#a855f7" opacity="0.15"/>
    <text x="278" y="389" font-family="Arial,sans-serif" font-size="11" fill="#a855f7" text-anchor="middle">🛒</text>
    <text x="300" y="382" font-family="Arial,sans-serif" font-size="10" fill="#fff">Shopping</text>
    <text x="300" y="394" font-family="Arial,sans-serif" font-size="8" fill="#555">Dec 10</text>
    <text x="455" y="386" font-family="Arial,sans-serif" font-size="11" fill="#f87171" text-anchor="end" font-weight="bold">-$89.00</text>
    <line x1="258" y1="402" x2="462" y2="402" stroke="#222" stroke-width="1"/>

    <!-- 4 -->
    <circle cx="278" cy="420" r="14" fill="#3b82f6" opacity="0.15"/>
    <text x="278" y="424" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">🚗</text>
    <text x="300" y="417" font-family="Arial,sans-serif" font-size="10" fill="#fff">Transport</text>
    <text x="300" y="429" font-family="Arial,sans-serif" font-size="8" fill="#555">Dec 9</text>
    <text x="455" y="421" font-family="Arial,sans-serif" font-size="11" fill="#f87171" text-anchor="end" font-weight="bold">-$12.00</text>

    <!-- Bottom nav bar -->
    <rect x="245" y="450" width="230" height="30" fill="#111"/>
    <text x="278" y="469" font-family="Arial,sans-serif" font-size="9" fill="#ff6b00" text-anchor="middle">🏠</text>
    <text x="323" y="469" font-family="Arial,sans-serif" font-size="9" fill="#444" text-anchor="middle">📊</text>
    <text x="360" y="465" font-family="Arial,sans-serif" font-size="18" fill="#ff6b00" text-anchor="middle" font-weight="bold">+</text>
    <text x="397" y="469" font-family="Arial,sans-serif" font-size="9" fill="#444" text-anchor="middle">💳</text>
    <text x="442" y="469" font-family="Arial,sans-serif" font-size="9" fill="#444" text-anchor="middle">⚙️</text>
  </g>

  <!-- Phone border -->
  <rect x="245" y="20" width="230" height="460" rx="36" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Side buttons -->
  <rect x="241" y="120" width="4" height="30" rx="2" fill="#333"/>
  <rect x="241" y="160" width="4" height="50" rx="2" fill="#333"/>
  <rect x="241" y="220" width="4" height="50" rx="2" fill="#333"/>
  <rect x="475" y="140" width="4" height="60" rx="2" fill="#333"/>

  <!-- Left text -->
  <text x="170" y="160" font-family="Arial,sans-serif" font-size="26" fill="#fff" font-weight="black" text-anchor="middle">Cash</text>
  <text x="170" y="192" font-family="Arial,sans-serif" font-size="26" fill="#ff6b00" font-weight="black" text-anchor="middle">Manager</text>
  <text x="170" y="224" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">Mobile App</text>

  <rect x="100" y="248" width="140" height="36" rx="18" fill="#ff6b00" opacity="0.1"/>
  <text x="170" y="271" font-family="Arial,sans-serif" font-size="11" fill="#ff6b00" text-anchor="middle">React Native · Firebase</text>

  <!-- Floating badges left -->
  <rect x="60" y="310" width="110" height="44" rx="10" fill="#1a1a1a"/>
  <text x="80" y="328" font-family="Arial,sans-serif" font-size="9" fill="#4ade80">↑ Income</text>
  <text x="80" y="344" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">+$5,240</text>

  <rect x="60" y="366" width="110" height="44" rx="10" fill="#1a1a1a"/>
  <text x="80" y="384" font-family="Arial,sans-serif" font-size="9" fill="#f87171">↓ Expense</text>
  <text x="80" y="400" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">-$2,180</text>

  <!-- Right text -->
  <text x="630" y="160" font-family="Arial,sans-serif" font-size="13" fill="#555" text-anchor="middle">Track your</text>
  <text x="630" y="180" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">spending &amp;</text>
  <text x="630" y="200" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">savings easily</text>

  <!-- Feature pills right -->
  <rect x="555" y="225" width="150" height="28" rx="14" fill="#1a1a1a"/>
  <text x="630" y="244" font-family="Arial,sans-serif" font-size="10" fill="#aaa" text-anchor="middle">📊 Expense Charts</text>

  <rect x="555" y="262" width="150" height="28" rx="14" fill="#1a1a1a"/>
  <text x="630" y="281" font-family="Arial,sans-serif" font-size="10" fill="#aaa" text-anchor="middle">💳 Transaction History</text>

  <rect x="555" y="299" width="150" height="28" rx="14" fill="#1a1a1a"/>
  <text x="630" y="318" font-family="Arial,sans-serif" font-size="10" fill="#aaa" text-anchor="middle">🎯 Budget Goals</text>

  <rect x="555" y="336" width="150" height="28" rx="14" fill="#1a1a1a"/>
  <text x="630" y="355" font-family="Arial,sans-serif" font-size="10" fill="#aaa" text-anchor="middle">🔒 Secure &amp; Private</text>
</svg>
